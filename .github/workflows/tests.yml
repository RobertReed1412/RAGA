# Runs the tests on every push, on all three OSes the launcher supports.
# The green badge this produces lets anyone see the tests pass without running anything.
name: tests
on: [push, pull_request]
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.13"]   # 3.9 is end-of-life; GitHub's Ubuntu 26.04 runners no longer ship it
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
      - run: python raga.py demo
